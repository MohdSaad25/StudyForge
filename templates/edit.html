{% extends "base.html" %}
{% block title %}Edit note{% endblock %}
{% block content %}
  <h1>Edit note</h1>
  <form method="POST">
    <input name="subject" value="{{ note.subject }}" required>
    <input name="title" value="{{ note.title }}" required>
    <textarea name="content" required>{{ note.content }}</textarea>
    <button type="submit">Save</button>
  </form>
{% endblock %}
