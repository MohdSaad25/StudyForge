<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyForge</title>
</head>
<body>
  <h1>StudyForge</h1>

  <form method="POST">
    <input name="subject" placeholder="Subject (e.g. DBMS)" required>
    <input name="title" placeholder="Note title" required>
    <textarea name="content" placeholder="Write your note..." required></textarea>
    <button type="submit">Add note</button>
  </form>

  <h2>Your notes</h2>
  <p>
    <a href="{{ url_for('home') }}">All</a>
      {% for s in subjects %}
    |    <a href="{{ url_for('home', subject=s) }}">{{ s }}</a>
      {% endfor %}
 </p>
{% if selected %}<p>Showing: <strong>{{ selected }}</strong></p>{% endif %}
  {% for note in notes %}
  <div>
    <strong>{{ note.subject }}</strong> - {{ note.title }}
    <p>{{ note.content }}</p>
    <a href="{{ url_for('edit', note_id=note.id) }}">Edit</a>
    <form method="POST" action="{{ url_for('delete', note_id=note.id) }}" style="display:inline">
      <button type="submit">Delete</button>
    </form>
  </div>
  {% else %}
  <p>No notes yet.</p>
{% endfor %}

</body>
</html>
