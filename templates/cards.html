<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Flashcards</title></head>
<body>
  <h1>My flashcards</h1>
  {% for c in cards %}
    <div>
      <strong>{{ c.subject }}</strong>: {{ c.question }}
      <p>{{ c.answer }}</p>
      <small>Next review: {{ c.next_review }} | Interval: {{ c.interval_days }} day(s) | Ease: {{ '%.2f'|format(c.ease) }}</small>
    </div>
  {% else %}
    <p>No flashcards yet. Add one from a note.</p>
  {% endfor %}
  <a href="{{ url_for('home') }}">Back</a>
</body>
</html>
