{% extends "base.html" %}
{% block title %}New flashcard{% endblock %}
{% block content %}
  <h1>New flashcard</h1>
  <p>From note: <strong>{{ note.subject }}</strong> - {{ note.title }}</p>
  <form method="POST">
    <input name="question" placeholder="Question" required>
    <textarea name="answer" placeholder="Answer" required></textarea>
    <button type="submit">Save card</button>
  </form>
{% endblock %}
