{% extends "base.html" %}
{% block title %}Ask your notes{% endblock %}
{% block content %}
  <h1>Ask your notes</h1>
  <form method="GET">
    <input name="q" value="{{ q }}" placeholder="e.g. What is deadlock?" required>
    <button type="submit">Ask</button>
  </form>

  {% if q %}
    {% for r in results %}
      <div>
        <p class="note-content">{{ r.text }}</p>
        <small>
          From: {{ r.subject }} - {{ r.title }} | Match: {{ r.score }}% |
          <a href="{{ url_for('note_view', note_id=r.note_id) }}">Open note</a>
        </small>
      </div>
    {% else %}
    {% endfor %}
  {% endif %}
{% endblock %}
