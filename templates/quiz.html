<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Quiz</title></head>
<body>
  <h1>Quiz: {{ subject }}</h1>
  {% if questions %}
    <form method="POST" action="{{ url_for('quiz_submit') }}">
      {% for q in questions %}
        <div>
          <p><strong>{{ loop.index }}.</strong> ({{ q.card.subject }}) {{ q.card.question }}</p>
          <input type="hidden" name="card_id" value="{{ q.card.id }}">
          {% for opt in q.options %}
            <label>
              <input type="radio" name="answer_{{ q.card.id }}" value="{{ opt }}" required>
              {{ opt }}
            </label><br>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit">Submit quiz</button>
    </form>
  {% else %}
    <p>No quiz available. Add flashcards to this subject first.</p>
  {% endif %}
  <br><a href="{{ url_for('quiz') }}">Back</a>
</body>
</html>
