<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Review</title></head>
<body>
  <h1>Review</h1>
  {% if card %}
    <p>{{ due }} card(s) due | {{ card.subject }}</p>
    <h2>{{ card.question }}</h2>
    <button onclick="document.getElementById('ans').style.display='block'; this.style.display='none'">
      Show answer
    </button>
    <div id="ans" style="display:none">
      <p>{{ card.answer }}</p>
      <form method="POST" action="{{ url_for('rate', card_id=card.id) }}">
        <button name="rating" value="again">Again</button>
        <button name="rating" value="good">Good</button>
        <button name="rating" value="easy">Easy</button>
      </form>
    </div>
  {% else %}
    <p>All caught up. No cards due today.</p>
  {% endif %}
  <br><a href="{{ url_for('home') }}">Back</a>
</body>
</html>
